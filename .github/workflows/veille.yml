# La veille : chaque lundi à 8 h (heure de Paris), GitHub lance l'extraction France Travail sur ses machines,
# met à jour data/ et le résumé de la page, et enregistre le tout par un commit.
# Les identifiants sont dans Settings -> Secrets and variables -> Actions (FT_CLIENT_ID, FT_CLIENT_SECRET).
name: veille

on:
  schedule:
    # GitHub ne connaît que l'UTC : lundi 8 h à Paris = 6 h UTC en été (CEST), 7 h UTC en hiver (CET).
    # On déclenche aux deux heures ; le job « heure » ne laisse passer que celle où il est 8 h à Paris.
    - cron: "0 6 * * 1"
    - cron: "0 7 * * 1"
  workflow_dispatch:          # et le bouton « Run workflow » pour lancer à la main, à toute heure

permissions:
  contents: write             # le workflow doit pouvoir pousser son commit

jobs:
  heure:
    runs-on: ubuntu-latest
    outputs:
      lancer: ${{ steps.test.outputs.lancer }}
    steps:
      - id: test
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(TZ=Europe/Paris date +%H)" = "08" ]; then
            echo "lancer=oui" >> "$GITHUB_OUTPUT"
          else
            echo "lancer=non" >> "$GITHUB_OUTPUT"
            echo "Il n'est pas 8 h à Paris : l'autre déclenchement s'en charge."
          fi

  extraire:
    needs: heure
    if: needs.heure.outputs.lancer == 'oui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Extraire les offres et refaire le résumé
        env:
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
        run: |
          python scripts/extraire.py
          python scripts/resumer.py

      - name: Enregistrer la donnée du jour (commit + push)
        run: |
          git config user.name "veille-bot"
          git config user.email "actions@github.com"
          git add data
          git commit -m "veille : offres du $(date -u +%Y-%m-%d)" || echo "rien de nouveau"
          git push
